name: Web

# Publishes the web version (web/ + the app data of src/Resources) on GitHub Pages.
# One-time setup in the repository: Settings > Pages > Source: GitHub Actions; for a custom domain,
# Settings > Pages > Custom domain (and a CNAME record at the domain registrar pointing to <user>.github.io).

on:
  push:
    branches: [main]
    paths: ["web/**", "src/Resources/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp src/Resources/*.json _site/data/
          cp -r src/Resources/icons src/Resources/maps _site/data/
          cp src/Resources/app.ico _site/favicon.ico
          touch _site/.nojekyll
          # new URLs for the scripts, styles and data at every deployment: a browser never mixes an old
          # cached script with a new page (all modules must import app.js with the same ?v= to share it)
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" _site/index.html _site/js/*.js
          grep -c "?v=$v" _site/index.html _site/js/*.js
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
