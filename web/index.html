<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IRR Companion</title>
  <meta name="description" content="Companion web app for Incursion Red River: AI preset editor with share codes, console command builder, weapon builder, trader stock, item prices, hideout upgrades, item heatmap on the maps and the story missions.">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/app.css?v=dev">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="title">IRR COMPANION</div>
      <div class="sub">Companion app for
        <a class="steam" href="https://store.steampowered.com/app/2116120/" target="_blank" rel="noopener" title="Incursion Red River on Steam">Incursion Red River ↗</a>
        · <span id="gamebuild">game data</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#presets" data-tab="presets">PRESETS</a>
      <a href="#commands" data-tab="commands">COMMANDS</a>
      <a href="#weapons" data-tab="weapons">WEAPONS</a>
      <a href="#traders" data-tab="traders">TRADERS</a>
      <a href="#items" data-tab="items">ITEMS</a>
      <a href="#hideout" data-tab="hideout">HIDEOUT</a>
      <a href="#maps" data-tab="maps">MAPS</a>
      <a href="#missions" data-tab="missions">MISSIONS</a>
    </nav>
  </header>
  <main id="view"></main>
  <footer class="status">
    <span id="status">Web version · the desktop app for Windows is on
      <a href="https://github.com/mordeci/irr-companion/releases/latest" target="_blank" rel="noopener">GitHub</a>.</span>
    <span class="right">Fan-made, not affiliated with the developers. Game icons and maps are their artwork.</span>
  </footer>
  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="js/app.js?v=dev"></script>
</body>
</html>
